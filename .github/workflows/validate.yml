name: Validate lab

# The lab is its isoloom.yml (https://www.isoloom.com): on every PR and push to main, the spec
# must be valid, the generated files under .isoloom/ current, and every generated Vagrant and
# Terraform output well formed. A lab with a container edition also comes up and passes its
# checks; a VM-only lab (e.g. a multi-VM AD range) has no Docker edition and can't run in CI, so
# it's covered by the isoloom/vagrant/terraform jobs alone.
# It also runs every week (upstream images and package mirrors change under a lab) and on demand.
# Free on public repositories (standard runners). A new lab spreads its weekly time: change the
# cron's minute, hour and day so hundreds of labs don't start together.
# The template itself has no isoloom.yml yet (only isoloom.yml.example): every job skips. The
# `files` job looks for them (hashFiles isn't allowed in a job-level `if`).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".ctf/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.look.outputs.spec }}
      docker: ${{ steps.look.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        run: |
          [ -f isoloom.yml ] && echo spec=true >> "$GITHUB_OUTPUT" || echo spec=false >> "$GITHUB_OUTPUT"
          [ -f .isoloom/docker/compose.yml ] && echo docker=true >> "$GITHUB_OUTPUT" || echo docker=false >> "$GITHUB_OUTPUT"

  isoloom:
    runs-on: ubuntu-latest
    needs: files
    if: needs.files.outputs.spec == 'true'
    steps:
      - uses: actions/checkout@v4
      # The Isoloom release the lab is generated with.
      - uses: isoloom/isoloom@v0.9.0
      - run: isoloom validate
      - name: Generated files are current (run `isoloom generate` and commit)
        run: isoloom check

  # Runs the lab for real (development evidence): it must come up healthy and pass its checks.
  # Only labs with a container edition — a VM-only lab (e.g. a multi-VM AD range) has no
  # compose.yml and can't run in CI; it is covered by the isoloom, vagrant and terraform jobs.
  lab:
    runs-on: ubuntu-latest
    needs: files
    if: needs.files.outputs.docker == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: isoloom/isoloom@v0.9.0
      - name: Free disk space (some labs pull several GB of images)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1
      - name: Start the lab (as players do, `isoloom run docker`)
        run: isoloom run docker
      - name: Checks (the lab's, and the ones derived from the spec, from every machine)
        run: isoloom test docker
      - name: Container state and logs
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          for c in $(docker ps -aq); do echo "=== $(docker inspect -f '{{.Name}}' "$c")"; docker logs --tail 80 "$c" 2>&1; done
      - name: Stop
        if: always()
        run: isoloom down docker || true

  terraform:
    runs-on: ubuntu-latest
    needs: files
    if: needs.files.outputs.spec == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: validate (Proxmox, every cloud)
        run: |
          for m in .isoloom/docker-vm/proxmox .isoloom/proxmox .isoloom/cloud-docker/* .isoloom/cloud-vm/*; do
            [ -f "$m/main.tf" ] || continue
            echo "== $m"
            terraform -chdir="$m" init -backend=false -input=false >/dev/null
            terraform -chdir="$m" validate
          done

  vagrant:
    runs-on: ubuntu-latest
    needs: files
    if: needs.files.outputs.spec == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Vagrantfiles parse
        run: for f in .isoloom/*/Vagrantfile; do ruby -c "$f"; done

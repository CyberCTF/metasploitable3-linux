# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Metasploitable 3, Ubuntu 14.04 machine (by Rapid7): an intentionally vulnerable Linux server
# with a dozen exploitable services and hidden card flags. Source: https://github.com/rapid7/metasploitable3,
# vendored in metasploitable3/. Built inside the VM by upstream's own Chef cookbooks
# (provision/build.sh). VM targets only. `isoloom run vagrant`, then `isoloom test vagrant`.
version: 1
name: metasploitable3-linux

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: { description: "This player's flag, written to /root/flag.txt." }

networks:
  lab: { cidr: 10.60.80.0/24 }

machines:
  ub1404:
    # Ubuntu 14.04 has no built-in OS name in Isoloom; the box is pinned in `overrides`.
    os: ubuntu@20.04
    networks: { lab: 10 }
    ports:
      ftp: 21
      ssh: 22
      http: { port: 80, protocol: http }
      smb: 445
      cups: 631
      mysql: 3306
      readme: 3500
      irc: 6697
      continuum: 8080
      sinatra: 8181
    resources: { cpus: 2, memory_mb: 3072, disk_gb: 40 }
    # The player's flag lands at /root/flag.txt, root-only: a root shell is needed to read it.
    # Placed before the build runs, as upstream's Chef cookbooks (build.sh) reboot the machine.
    files:
      - { path: /root/flag.txt, input: CTF_FLAG_MAIN, mode: "0400" }
    app:
      steps:
        - run: provision/build.sh

overrides:
  vagrant:
    machines:
      ub1404:
        box: ubuntu/trusty64
        box_version: "20191107.0.0"

# The machine reboots at the end of its build; the Java and Ruby services take a few minutes.
checks:
  - { name: web root answers, http: "http://ub1404/", wait: 600 }
  - { name: ssh answers, tcp: "ub1404:22" }
  - { name: proftpd answers, tcp: "ub1404:21", wait: 300 }
  - { name: samba answers, tcp: "ub1404:445" }
  - { name: mysql answers, tcp: "ub1404:3306" }
  - { name: unrealircd answers, tcp: "ub1404:6697", wait: 300 }
  - { name: continuum answers, tcp: "ub1404:8080", wait: 600 }
  - { name: readme app answers, tcp: "ub1404:3500", wait: 600 }
  - { name: sinatra answers, tcp: "ub1404:8181", wait: 600 }
  - checks/vulnerable-services.sh

message: |
  Metasploitable 3 (Ubuntu 14.04) is up at {{ machines.ub1404.addresses.lab }}. Scan it: FTP, SSH,
  HTTP (Drupal, phpMyAdmin, a payroll app), Samba, CUPS, MySQL, UnrealIRCd, Apache Continuum and
  more answer there. Get root and read /root/flag.txt; fifteen card flags are hidden too.
